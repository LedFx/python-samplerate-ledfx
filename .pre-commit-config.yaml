# Run with prek: `uv run prek run --all-files`, or `uv run prek install` for a
# git hook. CI's lint job and the autofix.ci workflow run this same set.
# `repo: builtin` hooks are prek-only (plain pre-commit can't run them).
# Vendored upstream patches must stay byte-for-byte (git apply).
exclude: ^external/patches/
repos:
  - repo: builtin
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
  # ruff runs from the locked version (uv.lock, bumped by Renovate), so there
  # is a single ruff pin. Args and filters match ruff-pre-commit.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --only-group dev ruff check --force-exclude
        args: [--fix]
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --only-group dev ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
  # GitHub Actions security audit. Config in .github/zizmor.yml; the gate is
  # --min-severity high (lower findings are advisory). prek provisions zizmor
  # itself; rev is the zizmor version, bumped by Renovate.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args:
          - --no-progress
          - --config
          - .github/zizmor.yml
          - --min-severity
          - high
          - .github/workflows/
  # Workflow syntax, expressions, job graph and inline shell (shellcheck).
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        entry: uv run --frozen --only-group dev actionlint
        language: system
        files: ^\.github/workflows/
        require_serial: true
