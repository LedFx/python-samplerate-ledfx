name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Weekly run: wheel tests install the newest NumPy/pytest, so this catches
  # dependency drift (e.g. the NumPy 2.4 resize break) between releases, and
  # new zizmor audits through the lint job.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel main or tag runs: tags publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides what a run needs, here rather than with paths-ignore: a workflow
  # skipped by paths-ignore never reports, so the required "CI passed" check
  # would wait forever. Skipped jobs count as passed.
  #
  # From the files a PR (or a push to main) changes, by what they can break:
  #   prose only (README, docs)      -> nothing runs
  #   repo metadata (other workflows, bot/lint config, examples)
  #                                  -> lint (actionlint, zizmor, ...)
  #   tests/ or uv.lock              -> lint, quick Linux tests, oldest NumPy
  #   anything else (src/, external/, build files, pyproject.toml, unknown
  #   paths, or this workflow)       -> everything, every wheel
  # Tags, the weekly schedule and manual runs always run everything.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # lists the PR's changed files
    outputs:
      code: ${{ steps.plan.outputs.code }} # lint
      tests: ${{ steps.plan.outputs.tests }} # tests without building wheels
      build: ${{ steps.plan.outputs.build }} # every wheel and the sdist
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      version_only: ${{ steps.version_scope.outputs.version_only }}
      matrix: ${{ steps.wheels.outputs.matrix }}
      wheel-plan: ${{ steps.wheels.outputs.wheel-plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # version-scope diffs PRs against origin/main: merge refs carry no
          # parents without full history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - id: wheels
        uses: LedFx/release-ci/actions/plan@442e00705d4e5edd589021851e756761363f9d84 # v0.3.1
      # A release-please PR (changelog, manifest, package version lines in
      # pyproject.toml/uv.lock) cannot alter built artifacts: the full wheel
      # matrix is redundant there, and again on the merge to main. Any other
      # change set — renovate dependency or lock bumps included — runs it.
      - id: version_scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          case "$EVENT" in
            pull_request) base="origin/main...HEAD" ;;
            push)
              if [[ "$REF" == refs/tags/* ]]; then exit 0; fi
              base="HEAD^"
              ;;
            *) exit 0 ;; # schedule and manual runs always build
          esac
          scope=$(python3 - <<'PY'
          import re, subprocess, sys

          def git(*args: str) -> str:
              result = subprocess.run(
                  ["git", *args], capture_output=True, text=True, timeout=30
              )
              return result.stdout if result.returncode == 0 else ""

          files = git("diff", "--name-only", base, "HEAD").split()
          if not files:
              print("false")  # empty or unreadable diff: build everything
              raise SystemExit
          prose = {"CHANGELOG.md", "CHANGELOG.rst", ".release-please-manifest.json"}
          manifests = {"pyproject.toml", "uv.lock"}
          rest = set(files) - manifests
          if rest and not rest <= prose:
              print("false")
              raise SystemExit
          anchors = ('name="samplerate-ledfx"', "[package]", "[project]")
          for name in [f for f in files if f in manifests]:
              patch = git("diff", "--unified=0", base, "HEAD", "--", name)
              if not patch:
                  print("false")
                  raise SystemExit
              for hunk in re.split(r"^@@", patch, flags=re.MULTILINE)[1:]:
                  lines = hunk.splitlines()
                  parts = lines[0].split(maxsplit=3)
                  anchor = parts[3].lstrip() if len(parts) > 3 else ""
                  changed = [
                      line[1:].lstrip()
                      for line in lines[1:]
                      if line[:1] in {"+", "-"}
                  ]
                  ok = changed and all(c.startswith("version") for c in changed)
                  ok = ok and anchor.replace(" ", "").startswith(anchors)
                  if not ok:
                      print("false")
                      raise SystemExit
          print("true")
          PY
          )
          echo "version_only=$scope" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          # PR-controlled on PR runs; it ends up in outputs and release names.
          if [[ ! "$version" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::Unexpected version string in pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The one guard for every publish path.
          if [[ "$REF" == refs/tags/v* && "$REF" != "refs/tags/v$version" ]]; then
            echo "::error::Tag ${REF#refs/tags/} does not match pyproject.toml version $version"
            exit 1
          fi
          # Only a tag push releases; re-run failed jobs to retry a release.
          if [[ "$EVENT" == push && "$REF" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

          # previous_filename: a file moved out of src/ is still a code change.
          # Plain assignments, so a failed API call fails this step (bash -e)
          # and with it CI passed, rather than reading as "nothing changed".
          files=""
          if [ -n "$PR" ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          elif [[ "$EVENT" == push && "$REF" == refs/heads/main && ! "$BEFORE" =~ ^0+$ ]]; then
            compare=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER")
            # The compare API lists at most 300 files: past that, run everything.
            if [ "$(jq '.files | length' <<< "$compare")" -lt 300 ]; then
              files=$(jq -r '.files[] | .filename, (.previous_filename // empty)' <<< "$compare")
            fi
          fi

          code=true tests=true build=true
          if [ -n "$files" ] && ! grep -qx '.github/workflows/ci.yml' <<< "$files"; then
            prose='^(docs/|[^/]+\.(md|rst)$)'
            meta='^(docs/|[^/]+\.(md|rst)$|\.github/|examples/|renovate\.json$|release-please-config\.json$|\.release-please-manifest\.json$|\.pre-commit-config\.yaml$|\.gitignore$|\.git-blame-ignore-revs$|\.python-version$)'
            # here-strings, not pipes: grep -q exiting early + pipefail would read as "no match"
            grep -qvE "$prose" <<< "$files" || code=false
            grep -qvE "$meta" <<< "$files" || tests=false
            grep -qvE "$meta|^tests/|^uv\.lock$" <<< "$files" || build=false
          fi
          {
            echo "code=$code"
            echo "tests=$tests"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "### Plan: code=$code tests=$tests build=$build" >> "$GITHUB_STEP_SUMMARY"

  # Fast lint gate before any build spend: the prek hook set contributors run
  # locally (`uv run prek run --all-files`), zizmor and actionlint included.
  # autofix.ci runs in parallel and pushes fixes; its push re-runs this.
  lint:
    name: Lint (prek)
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uv run --frozen --only-group dev prek run --all-files --show-diff-on-failure
      - name: Shared publication wiring contracts
        run: python3 ci/test_shared_release.py

  build_wheels:
    name: Build wheels on ${{ matrix.runner }}
    needs: [plan, lint]
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.version_only != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Build and test wheels
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: >-
          uv run --frozen --only-group wheel-build python -m cibuildwheel .
          --config-file pyproject.toml --platform "$PLATFORM" --archs "$ARCH"
          --output-dir wheelhouse

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cibw-wheels-${{ matrix.runner }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build and test source distribution
    needs: [plan, lint]
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.version_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false # output is published; don't restore a cache

      # `uv build` builds the sdist, then a wheel *from* the sdist, so a file
      # missing from MANIFEST.in fails here instead of on a user's machine.
      - name: Build sdist and a wheel from it
        run: uv build

      # Tests from the unpacked sdist, so they must ship in it too.
      - name: Test the wheel built from the sdist
        run: |
          uv venv
          uv pip install dist/*.whl --group test
          mkdir sdist
          tar -xzf dist/*.tar.gz -C sdist --strip-components=1
          uv run --no-project pytest sdist/tests -m "not perf"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Tests-only and lock-only changes cannot change the compiled wheels: build
  # once from source on the oldest and newest Python instead of every wheel.
  test_linux:
    name: Test (Linux, py${{ matrix.python }})
    needs: [plan, lint]
    if: needs.plan.outputs.tests == 'true' && needs.plan.outputs.build != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Build and install
        env:
          PYTHON: ${{ matrix.python }}
        run: uv sync --locked --python "$PYTHON" --group test

      - name: Test
        run: uv run --no-sync pytest tests -m "not perf"

  # Keep the NumPy floor in pyproject.toml honest: oldest supported Python
  # with the oldest allowed NumPy.
  numpy_oldest:
    name: Test oldest supported NumPy
    needs: [plan, lint]
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Build and install with the oldest NumPy
        run: |
          uv venv
          floor=$(sed -n 's/.*"numpy>=\([0-9.]*\)".*/\1/p' pyproject.toml)
          uv pip install . --group test "numpy==$floor"

      - name: Test
        run: |
          uv run --no-project python -c "import numpy; print('numpy', numpy.__version__)"
          uv run --no-project pytest tests -m "not perf"

  # Early warning: NumPy's nightly builds on the newest CPython. Not a release
  # gate; it only runs on the schedule or by hand, and stays out of CI passed.
  numpy_nightly:
    name: Test against NumPy nightly
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Build and install
        run: uv sync --python 3.15 --group test

      - name: Install NumPy nightly
        run: >
          uv pip install --pre --upgrade
          --index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
          numpy

      - name: Test
        run: |
          uv run --no-sync python -c "import numpy; print('numpy', numpy.__version__)"
          uv run --no-sync pytest tests -m "not perf"

  # The one check branch protection requires. Every gating job belongs in
  # needs; its name must never change.
  ci-passed:
    name: CI passed
    if: always()
    needs: [plan, lint, build_wheels, build_sdist, test_linux, numpy_oldest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Release: tag v<version> only (release-please.yml creates it). Each job only
  # downloads the tested artifacts and publishes them.
  #
  # !cancelled() plus explicit results: without a status function, `if:` implies
  # success(), which fails when ANY upstream job was skipped, transitively.
  # CI passed runs with always() over jobs the plan skips (on a tag, the quick
  # Linux tests), so success() would skip the release even when CI passed.
  publish-release:
    name: Publish verified package release
    needs: [plan, ci-passed]
    if: >-
      !cancelled() &&
      github.repository == 'LedFx/samplerate-ledfx' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      needs.plan.result == 'success' && needs.plan.outputs.release == 'true' &&
      needs.ci-passed.result == 'success'
    environment:
      name: pypi
      url: https://pypi.org/p/samplerate-ledfx/
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cibw-*
          merge-multiple: true
          path: dist/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            pyproject.toml
          sparse-checkout-cone-mode: false
          path: release-tools
      - name: Mint scoped publication token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-attestations: write
      - name: Freeze verified distributions and release identity
        id: prepare
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@442e00705d4e5edd589021851e756761363f9d84 # v0.3.1
        with:
          phase: prepare
          project: release-tools
          dist: dist
          snapshot: ${{ runner.temp }}/release-snapshot.json
          wheel-plan: ${{ needs.plan.outputs.wheel-plan }}
      - name: Attest the tested distributions
        id: provenance
        if: steps.prepare.outputs.already_published != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/dist/*
          create-storage-record: false
          github-token: ${{ steps.release-token.outputs.token }}
      - name: Recheck immutable inputs before PyPI upload
        id: upload
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@442e00705d4e5edd589021851e756761363f9d84 # v0.3.1
        with:
          phase: check-upload
          project: release-tools
          dist: dist
          snapshot: ${{ runner.temp }}/release-snapshot.json
          wheel-plan: ${{ needs.plan.outputs.wheel-plan }}
      - name: Stage verified distributions for PyPI
        if: steps.upload.outputs.pypi_upload == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir pypi-dist
          cp -- dist/* pypi-dist/
      - name: Publish matching missing Python distributions
        if: steps.upload.outputs.pypi_upload == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist/
          skip-existing: true # Both preflights require matching remote SHA-256.
      - name: Verify provenance and finalize existing GitHub draft
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@442e00705d4e5edd589021851e756761363f9d84 # v0.3.1
        with:
          phase: finalize
          project: release-tools
          dist: dist
          snapshot: ${{ runner.temp }}/release-snapshot.json
          wheel-plan: ${{ needs.plan.outputs.wheel-plan }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.prepare.outcome == 'success'
        with:
          name: release-provenance-${{ github.ref_name }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-snapshot.json
            ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
